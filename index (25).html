<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>语境呼应法 · 逻辑填空修炼场</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0f0f1a;
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
  }

  /* 星空背景 */
  .stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at top, #1a1a3e 0%, #0f0f1a 50%, #0a0a14 100%);
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 500px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    min-height: 100vh;
  }

  /* 顶栏 */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .points {
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 2px 10px rgba(251,191,36,0.3);
  }
  .points-icon { font-size: 16px; }
  .streak {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255,255,255,0.1);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
  }

  /* 标题区 */
  .hero {
    text-align: center;
    margin-bottom: 24px;
  }
  .hero h1 {
    font-size: 22px;
    background: linear-gradient(135deg, #a78bfa, #818cf8, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .hero p {
    font-size: 13px;
    color: #999;
  }

  /* 进度条 */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .progress-bar {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    height: 8px;
    overflow: hidden;
  }
  .progress-fill {
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    height: 100%;
    border-radius: 10px;
    transition: width 0.5s ease;
    width: 0%;
  }
  .progress-text {
    font-size: 12px;
    color: #888;
    white-space: nowrap;
  }

  /* 题目卡片 */
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 24px 20px;
    backdrop-filter: blur(10px);
    margin-bottom: 16px;
  }
  .question-tag {
    display: inline-block;
    background: linear-gradient(135deg, #818cf8, #6366f1);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    margin-bottom: 14px;
  }
  .question-text {
    font-size: 16px;
    line-height: 1.9;
    color: #e0e0e0;
  }
  .blank {
    display: inline-block;
    min-width: 50px;
    border-bottom: 2px solid #818cf8;
    text-align: center;
    color: #a78bfa;
    font-weight: bold;
    margin: 0 2px;
  }

  /* 选项 */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }
  .option {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s;
    font-size: 15px;
  }
  .option:active { transform: scale(0.98); }
  .option:hover { border-color: rgba(129,140,248,0.5); background: rgba(129,140,248,0.08); }
  .option.selected {
    border-color: #818cf8;
    background: rgba(129,140,248,0.15);
    box-shadow: 0 0 20px rgba(129,140,248,0.2);
  }
  .option.correct {
    border-color: #10b981;
    background: rgba(16,185,129,0.15);
    box-shadow: 0 0 20px rgba(16,185,129,0.2);
    animation: pop 0.4s ease;
  }
  .option.wrong {
    border-color: #ef4444;
    background: rgba(239,68,68,0.15);
    animation: shake 0.4s ease;
  }
  .option.disabled { cursor: default; pointer-events: none; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .option-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    font-weight: bold;
    font-size: 14px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .option.selected .option-label { background: #818cf8; }
  .option.correct .option-label { background: #10b981; }
  .option.wrong .option-label { background: #ef4444; }
  .option-words {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .word-chip {
    background: rgba(255,255,255,0.06);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 14px;
  }

  /* 按钮 */
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 16px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, #818cf8, #6366f1);
    color: #fff;
    box-shadow: 0 4px 15px rgba(99,102,241,0.4);
  }
  .btn-primary:disabled {
    background: rgba(255,255,255,0.1);
    box-shadow: none;
    color: #555;
    cursor: not-allowed;
  }
  .btn-next {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    box-shadow: 0 4px 15px rgba(16,185,129,0.4);
  }

  /* 反馈弹层 */
  .feedback {
    margin-top: 16px;
    padding: 20px;
    border-radius: 16px;
    text-align: center;
    display: none;
    animation: fadeUp 0.4s ease;
  }
  .feedback.show { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .feedback.correct-fb {
    background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(5,150,105,0.1));
    border: 1px solid rgba(16,185,129,0.3);
  }
  .feedback.wrong-fb {
    background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(245,158,11,0.08));
    border: 1px solid rgba(251,191,36,0.3);
  }
  .feedback-emoji {
    font-size: 36px;
    margin-bottom: 8px;
  }
  .feedback-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .feedback.correct-fb .feedback-title { color: #34d399; }
  .feedback.wrong-fb .feedback-title { color: #fbbf24; }
  .feedback-msg {
    font-size: 14px;
    color: #aaa;
    line-height: 1.6;
  }
  .feedback-points {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    background: rgba(251,191,36,0.2);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 14px;
    color: #fbbf24;
    font-weight: bold;
  }

  /* 解析 */
  .analysis {
    margin-top: 16px;
    padding: 18px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    border-left: 3px solid #818cf8;
    display: none;
  }
  .analysis.show { display: block; animation: fadeUp 0.4s ease; }
  .analysis-title {
    font-size: 14px;
    font-weight: bold;
    color: #a78bfa;
    margin-bottom: 12px;
  }
  .analysis-step {
    margin-bottom: 10px;
    line-height: 1.7;
    font-size: 14px;
    color: #ccc;
  }
  .step-tag {
    display: inline-block;
    background: rgba(129,140,248,0.2);
    color: #a78bfa;
    border-radius: 6px;
    padding: 1px 8px;
    font-size: 12px;
    margin-right: 6px;
  }
  .kw { color: #fbbf24; font-weight: bold; }
  .strike { text-decoration: line-through; color: #666; }

  /* 结果页 */
  .result-card {
    text-align: center;
    padding: 40px 20px;
  }
  .result-emoji { font-size: 60px; margin-bottom: 16px; }
  .result-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .result-subtitle {
    font-size: 14px;
    color: #999;
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .result-score-box {
    background: linear-gradient(135deg, rgba(129,140,248,0.15), rgba(99,102,241,0.1));
    border: 1px solid rgba(129,140,248,0.3);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .score-big {
    font-size: 56px;
    font-weight: bold;
    background: linear-gradient(135deg, #a78bfa, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .score-label { font-size: 14px; color: #888; }
  .result-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 24px;
  }
  .stat-item { text-align: center; }
  .stat-num { font-size: 22px; font-weight: bold; }
  .stat-num.green { color: #34d399; }
  .stat-num.red { color: #f87171; }
  .stat-num.gold { color: #fbbf24; }
  .stat-desc { font-size: 12px; color: #777; margin-top: 2px; }

  /* 底部引导 */
  .bottom-cta {
    background: linear-gradient(135deg, rgba(129,140,248,0.12), rgba(96,165,250,0.08));
    border: 1px solid rgba(129,140,248,0.25);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-top: 16px;
  }
  .bottom-cta h3 {
    font-size: 16px;
    margin-bottom: 6px;
    color: #a78bfa;
  }
  .bottom-cta p {
    font-size: 13px;
    color: #999;
    line-height: 1.6;
  }

  .hidden { display: none !important; }

  /* 积分飞出动画 */
  .points-fly {
    position: fixed;
    font-size: 24px;
    font-weight: bold;
    color: #fbbf24;
    pointer-events: none;
    z-index: 999;
    animation: flyUp 1s ease forwards;
  }
  @keyframes flyUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
  }

  /* 模块标签 */
  .module-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .module-tabs::-webkit-scrollbar { display: none; }
  .module-tab {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: #888;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .module-tab:active { transform: scale(0.96); }
  .module-tab.active {
    border-color: #818cf8;
    background: rgba(129,140,248,0.15);
    color: #a78bfa;
    font-weight: bold;
  }

  /* 模式切换 & 进度统计 */
  .mode-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .mode-btn {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: #888;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .mode-btn.active {
    border-color: #818cf8;
    background: rgba(129,140,248,0.15);
    color: #a78bfa;
    font-weight: bold;
  }
  .wrong-badge {
    display: inline-block;
    background: #ef4444;
    color: #fff;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 4px;
    font-weight: bold;
  }
  .progress-stats {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 12px;
    color: #666;
    margin-bottom: 12px;
  }
  .stat-tag {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .stat-tag .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-green { background: #10b981; }
  .dot-red { background: #ef4444; }
  .dot-gray { background: #555; }

  /* 横向题目导航条 */
  .nav-strip-wrap {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .nav-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .nav-strip::-webkit-scrollbar { height: 3px; }
  .nav-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  .nav-dot {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    color: #666;
    transition: all 0.2s;
    user-select: none;
  }
  .nav-dot:active { transform: scale(0.9); }
  .nav-dot.done {
    border-color: #10b981;
    background: rgba(16,185,129,0.15);
    color: #34d399;
  }
  .nav-dot.wrong {
    border-color: #ef4444;
    background: rgba(239,68,68,0.15);
    color: #f87171;
  }
  .nav-dot.current {
    border-color: #a78bfa;
    background: rgba(129,140,248,0.25);
    color: #c4b5fd;
    box-shadow: 0 0 10px rgba(129,140,248,0.4);
    transform: scale(1.1);
  }

  /* 操作按钮栏 */
  .action-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .action-row .btn {
    flex: 1;
    min-width: 0;
    padding: 10px 6px;
    font-size: 13px;
    margin-top: 0;
    border-radius: 10px;
  }
  .btn-ghost {
    background: rgba(255,255,255,0.06);
    color: #aaa;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: none;
  }
  .btn-review {
    background: rgba(251,191,36,0.12);
    color: #fbbf24;
    border: 1px solid rgba(251,191,36,0.3);
    box-shadow: none;
  }

  /* 完成视图 */
  .complete-view {
    text-align: center;
    padding: 50px 20px;
  }
  .complete-view .emoji { font-size: 50px; margin-bottom: 16px; }
  .complete-view h2 {
    font-size: 20px;
    color: #a78bfa;
    margin-bottom: 8px;
  }
  .complete-view p {
    font-size: 14px;
    color: #888;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .reset-link {
    text-align: center;
    margin-top: 24px;
  }
  .reset-link a {
    font-size: 12px;
    color: #555;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="container">
  <div class="topbar">
    <div class="points">
      <span class="points-icon">⭐</span>
      <span id="pointsDisplay">0</span> 积分
    </div>
    <div class="streak">
      <span>🔥</span>
      <span>连续 <b id="streakDisplay">0</b> 题</span>
    </div>
  </div>

  <div class="hero">
    <h1>🧠 逻辑填空修炼场</h1>
    <p>语境呼应法 · 不用背成语也能做对题</p>
  </div>

  <div id="moduleTabs" class="module-tabs"></div>

  <div id="modeToggle" class="mode-toggle">
    <div class="mode-btn active" id="btnNew" onclick="switchMode('all')">全部题目</div>
    <div class="mode-btn" id="btnWrong" onclick="switchMode('wrong')">错题回顾 <span id="wrongBadge" class="wrong-badge hidden">0</span></div>
  </div>

  <div class="progress-stats" id="progressStats">
    <div class="stat-tag"><span class="dot dot-green"></span> 已掌握 <b id="statDone">0</b></div>
    <div class="stat-tag"><span class="dot dot-red"></span> 待攻克 <b id="statWrong">0</b></div>
    <div class="stat-tag"><span class="dot dot-gray"></span> 未做 <b id="statLeft">0</b></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0/0</div>
  </div>

  <div id="completeView" class="hidden">
    <div class="card complete-view">
      <div class="emoji">🎉</div>
      <h2>本轮题目全部完成！</h2>
      <p id="completeStats"></p>
      <button class="btn btn-primary" id="btnGoWrong" onclick="switchMode('wrong')">回顾错题</button>
      <div class="reset-link"><a onclick="resetAllProgress()">重置全部进度</a></div>
    </div>
  </div>

  <div id="quizArea"></div>

  <div id="navStripWrap" class="nav-strip-wrap">
    <div class="nav-strip" id="navStrip"></div>
  </div>

  <div class="action-row">
    <button class="btn btn-ghost" onclick="redoAll()">🔄 全部重做</button>
    <button class="btn btn-review" onclick="switchMode('wrong')">❌ 错题集</button>
    <button class="btn btn-ghost" onclick="resetAllProgress()">🗑️ 重置进度</button>
  </div>

  <div id="resultArea" class="hidden">
    <div class="card result-card">
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-subtitle" id="resultSubtitle"></div>
      <div class="result-score-box">
        <div class="score-big" id="resultScore">0%</div>
        <div class="score-label">正确率</div>
      </div>
      <div class="result-stats">
        <div class="stat-item">
          <div class="stat-num green" id="correctCount">0</div>
          <div class="stat-desc">答对</div>
        </div>
        <div class="stat-item">
          <div class="stat-num red" id="wrongCount">0</div>
          <div class="stat-desc">答错</div>
        </div>
        <div class="stat-item">
          <div class="stat-num gold" id="totalPoints">0</div>
          <div class="stat-desc">获得积分</div>
        </div>
      </div>
      <div style="text-align:center;margin-top:12px;font-size:13px;color:#aaa;">100积分 = 1次一对一答疑服务</div>

      <button class="btn btn-primary" onclick="restart()">再来一轮 🔄</button>

      <div class="bottom-cta">
        <h3>💡 想学会这套方法？</h3>
        <p>关注B站「考公人tjmtkn」<br>更多语境呼应法技巧持续更新中</p>
      </div>
    </div>
  </div>
</div>

<script>
// 创建星空
(function(){
  const stars = document.getElementById('stars');
  for(let i=0;i<50;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = Math.random()*3+'s';
    s.style.width = s.style.height = (Math.random()*2+1)+'px';
    stars.appendChild(s);
  }
})();

// 模块定义：后续新增模块只需在此添加新条目
const MODULES = {
  yujing: {
    id: 'yujing',
    name: '语境呼应法',
    icon: '🧠',
    storageKey: 'yjhj_progress_yujing',
    questionsRef: 'questions' // 指向下方 questions 数组
  }
  // 示例：新增模块只需加一行
  // ciyu: { id: 'ciyu', name: '词语辨析', icon: '📖', storageKey: 'yjhj_progress_ciyu', questionsRef: 'questions_ciyu' }
};
let currentModuleId = 'yujing';

function getCurrentModule() { return MODULES[currentModuleId]; }
function getCurrentQuestions() { return questions; } // 当前只有语境模块，后续按 moduleId 映射

// 渲染模块标签
function renderModuleTabs() {
  const container = document.getElementById('moduleTabs');
  if (!container) return;
  let html = '';
  for (const key in MODULES) {
    const m = MODULES[key];
    const active = key === currentModuleId ? ' active' : '';
    html += `<div class="module-tab${active}" onclick="switchModule('${key}')">${m.icon} ${m.name}</div>`;
  }
  container.innerHTML = html;
}

function switchModule(moduleId) {
  if (moduleId === currentModuleId) return;
  // 保存当前模块进度后切换
  currentModuleId = moduleId;
  // 加载新模块进度
  loadProgress();
  renderModuleTabs();
  currentMode = 'all';
  document.getElementById('btnNew').classList.add('active');
  document.getElementById('btnWrong').classList.remove('active');
  reviewMode = false;
  startSession();
}

// localStorage 兼容层（file:// 协议下可能不可用）
var safeStorage = {
  _data: {},
  getItem: function(key) {
    try { return localStorage.getItem(key); } catch(e) { return this._data[key] || null; }
  },
  setItem: function(key, val) {
    try { localStorage.setItem(key, val); } catch(e) { this._data[key] = val; }
  },
  removeItem: function(key) {
    try { localStorage.removeItem(key); } catch(e) { delete this._data[key]; }
  }
};

function getStorageKey() {
  return 'yjhj_progress_' + currentModuleId;
}

// 进度持久化（按模块+用户独立存储）
let currentMode = 'all';
let activeList = [];
let wrongList = [];
let completedSet = {};
let points = 0;

function loadProgress() {
  try {
    const saved = JSON.parse(safeStorage.getItem(getStorageKey()) || '{}');
    completedSet = saved.completed || {};
    wrongList = saved.wrong || [];
    points = saved.points || 0;
  } catch(e) { completedSet = {}; wrongList = []; points = 0; }
}

function saveProgress() {
  try { safeStorage.setItem(getStorageKey(), JSON.stringify({ completed: completedSet, wrong: wrongList, points: points })); } catch(e) {}
}

function getCompletedCount() { return Object.keys(completedSet).length; }

function updateStats() {
  const qs = getCurrentQuestions();
  const done = getCompletedCount();
  const wrong = wrongList.length;
  const left = qs.length - done;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statLeft').textContent = left < 0 ? 0 : left;
  const badge = document.getElementById('wrongBadge');
  if (wrong > 0) { badge.textContent = wrong; badge.classList.remove('hidden'); }
  else { badge.classList.add('hidden'); }
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('btnNew').classList.toggle('active', mode === 'all');
  document.getElementById('btnWrong').classList.toggle('active', mode === 'wrong');
  document.getElementById('completeView').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.querySelector('.progress-wrap').classList.remove('hidden');
  reviewMode = false;
  startSession();
}

function startSession() {
  const qs = getCurrentQuestions();
  currentQ = 0; score = 0; streak = 0;
  answered = false;
  if (currentMode === 'wrong') {
    activeList = wrongList.slice();
    reviewMode = true;
  } else {
    currentMode = 'all';
    activeList = [];
    for (let i = 0; i < qs.length; i++) activeList.push(i);
  }
  updateTopbar();
  updateStats();
  if (activeList.length === 0) {
    showCompleteView();
  } else {
    renderQuestion();
  }
}

function showCompleteView() {
  const qs = getCurrentQuestions();
  document.getElementById('quizArea').classList.add('hidden');
  document.querySelector('.progress-wrap').classList.add('hidden');
  const done = getCompletedCount();
  const wrong = wrongList.length;
  const pct = Math.round(done / qs.length * 100);
  let msg = `你已完成 ${done}/${qs.length} 道题（${pct}%）`;
  if (wrong > 0) msg += `，还有 ${wrong} 道错题待攻克。`;
  else if (done === qs.length) msg = '🎊 全部题目已掌握，太厉害了！';
  document.getElementById('completeStats').textContent = msg;
  document.getElementById('btnGoWrong').style.display = wrong > 0 ? 'block' : 'none';
  document.getElementById('completeView').classList.remove('hidden');
}

function resetAllProgress() {
  if (confirm('确定要重置当前模块所有进度和错题记录吗？')) {
    safeStorage.removeItem(getStorageKey());
    completedSet = {};
    wrongList = [];
    currentMode = 'all';
    reviewMode = false;
    document.getElementById('btnNew').classList.add('active');
    document.getElementById('btnWrong').classList.remove('active');
    startSession();
  }
}

      { tag: '排除C', text: '<span class="kw">"互为表里"</span>——一个是表一个是里，题干没有说什么是表什么是里，排除。' },
      { tag: '锁定A ✅', text: 'A<span class="kw">"息息相关"</span>——围棋与大局观是有关系的。<span class="kw">选A</span>。' },
      { tag: '第二空验证 ✅', text: '"下围棋一定要___全局"——A"照应全局"：下围棋一定要照应全局，看全局嘛，符合。<span class="kw">选A</span>（息息相关／照应）。' }
    ]
  },
  {
    tag: '逻辑填空 · 双空',
    text: '复盘一些网暴事件不难发现，绝大多数攻击都是基于一种道德判断，尽管这种道德判断是盲目的、偏激的，但施暴者却<span class="blank">①</span>，将这种道德判断强加在受害者身上。面对网暴，任何试图摆事实、讲道理的努力都<span class="blank">②</span>，反倒是为他们提供了更多"情绪劳动"的线索和资源。',
    options: [
      { label: 'A', words: ['自欺欺人', '徒劳无功'] },
      { label: 'B', words: ['自以为是', '无济于事'], correct: true },
      { label: 'C', words: ['不以为然', '百无一用'] },
      { label: 'D', words: ['不辨真伪', '于事无补'] }
    ],
    analysis: [
      { tag: '第一空·排除D', text: '题干里并没有<span class="kw">真伪、对错</span>的真假退出表述，所以"不辨真伪"不对，排除。' },
      { tag: '排除C', text: '<span class="kw">"不以为然"</span>——不认为这样是对的，那就和题目所说的意思违背了（施暴者是认为自己对才强加给别人），排除。' },
      { tag: '排除A', text: '<span class="kw">"自欺欺人"</span>——自己欺骗自己，题干并没有表达"明明知道是对的、明明知道是伤害你的，但假装不知道继续伤害你"的意思，排除。' },
      { tag: '锁定B ✅', text: 'B<span class="kw">"自以为是"</span>——自己认为这是对的，很多网络施暴者就是"我认为是这样就是这样，所以你不这样我就批判你"。' },
      { tag: '第二空验证 ✅', text: '"任何试图摆事实讲道理的努力都___"——B<span class="kw">"无济于事"</span>：没用，反倒是给他们提供了更多情绪劳动。<span class="kw">选B</span>（自以为是／无济于事）。' }
    ]
  },
  {
    tag: '逻辑填空 · 三空',
    text: '欣赏现场古典音乐表演时，往往有以下<span class="blank">①</span>的规矩：手机调成静音，安静就座，保持肃静，<span class="blank">②</span>地聆听，等一首作品表演完毕才鼓掌……然而，这些看似<span class="blank">③</span>的欣赏古典音乐表演的方式只是现代社会的独有现象，在这些音乐作品诞生的那个年代，欣赏方式并非如此。',
    options: [
      { label: 'A', words: ['一丝不苟', '心无旁骛', '规范'] },
      { label: 'B', words: ['郑重其事', '正襟危坐', '科学'] },
      { label: 'C', words: ['众所周知', '目不转睛', '标准'] },
      { label: 'D', words: ['约定俗成', '全神贯注', '正确'], correct: true }
    ],
    analysis: [
      { tag: '第一空·解题点', text: '"<span class="kw">往往</span>"是什么意思？就经常、一直都是这样。看ABCD，只有D<span class="kw">"约定俗成"</span>有"之前就有、一直这样"的意思，所以大概率把答案锁在D。' },
      { tag: '第二空验证 ✅', text: '"___地聆听"——D<span class="kw">"全神贯注"</span>：手机调成静音、安静肃静，那可不得认真的、全神贯注地聆听吗？符合。' },
      { tag: '第三空验证 ✅', text: '"这些看似___的欣赏方式"——D<span class="kw">"正确"</span>：看似正确的欣赏方式，只是现代社会的独有现象，以前并非如此。<span class="kw">选D</span>（约定俗成／全神贯注／正确）。' }
    ]
  },
  {
    tag: '逻辑填空 · 单空',
    text: '户外不等于"野外"，运动不等于"盲动"。我们固然不能因为安全风险就<span class="blank">①</span>，但户外运动也要做好事前防范，注意风险管控。',
    options: [
      { label: 'A', words: ['深居简出'] },
      { label: 'B', words: ['投鼠忌器'] },
      { label: 'C', words: ['因噎废食'], correct: true },
      { label: 'D', words: ['委曲求全'] }
    ],
    analysis: [
      { tag: '语境分析', text: '"不能因为安全风险就___"——意思是<span class="kw">不能因为怕有风险就不去做</span>，不能太过。' },
      { tag: '排除A', text: '<span class="kw">"深居简出"</span>——题干里没提到"深"和"简"的意思，排除。' },
      { tag: '排除B', text: '<span class="kw">"投鼠忌器"</span>——投是扔东西打老鼠，害怕打坏旁边的容器。题干没有表达这个意思，排除。' },
      { tag: '锁定C ✅', text: 'C<span class="kw">"因噎废食"</span>——害怕噎到就不吃食物了，完美对应"不能因为安全风险就不做运动"。<span class="kw">选C</span>。' },
      { tag: '排除D验证', text: '<span class="kw">"委曲求全"</span>——委屈自己来求一个完全，这里没有"全"的意思，排除。' }
    ]
  }
];

let currentQ = 0, score = 0, streak = 0, answered = false;
let reviewMode = false; // 是否在查看已答题（非做题模式）

function renderQuestion() {
  const origIdx = activeList[currentQ];
  const q = questions[origIdx];
  const isReview = reviewMode || (completedSet[origIdx] !== undefined && currentMode === 'all');
  answered = isReview;

  const area = document.getElementById('quizArea');
  const correctIdx = q.options.findIndex(o => o.correct);
  const wasCorrect = completedSet[origIdx] === true;

  area.innerHTML = `
    <div class="card">
      <div class="question-tag">${q.tag}${isReview ? (wasCorrect ? ' ✅' : ' ❌') : ''}</div>
      <div class="question-text">${q.text}</div>
      <div class="options">
        ${q.options.map((opt,i)=>{
          let cls = 'option';
          if(isReview) {
            cls += ' disabled';
            if(opt.correct) cls += ' correct';
          }
          return `
          <div class="${cls}" data-index="${i}" onclick="${isReview ? '' : 'selectOption('+i+')'}">
            <span class="option-label">${opt.label}</span>
            <div class="option-words">
              ${opt.words.map(w=>`<span class="word-chip">${w}</span>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
      ${isReview ? '' : '<button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>提交答案</button>'}
      <div class="feedback ${isReview ? (wasCorrect ? 'correct-fb show' : 'wrong-fb show') : ''}" id="feedback" ${isReview ? '' : 'style="display:none"'}>
        ${isReview ? `<div class="feedback-emoji">${wasCorrect ? '🎉' : '🌱'}</div><div class="feedback-title">${wasCorrect ? '答对了' : '答错了'}</div><div class="feedback-msg">正确答案：${q.options[correctIdx].label}</div>` : ''}
      </div>
      <div class="analysis ${isReview ? 'show' : ''}" id="analysis">
        <div class="analysis-title">🔍 语境呼应法拆解</div>
        ${q.analysis.map(a=>`<div class="analysis-step"><span class="step-tag">${a.tag}</span>${a.text}</div>`).join('')}
      </div>
      ${isReview ? `
        <div class="action-bar">
          <button class="btn btn-review" onclick="redoOne(${origIdx})">🔄 重做此题</button>
          ${currentQ > 0 ? '<button class="btn btn-ghost" onclick="prevQuestion()">← 上一题</button>' : ''}
          ${currentQ < activeList.length - 1 ? '<button class="btn btn-primary" onclick="nextQuestion()">下一题 →</button>' : ''}
        </div>
      ` : `
        <div class="action-bar">
          ${currentQ > 0 ? '<button class="btn btn-ghost" onclick="prevQuestion()">← 上一题</button>' : ''}
          <button class="btn btn-next" id="nextBtn" style="display:none" onclick="nextQuestion()">${currentQ < activeList.length - 1 ? '下一题 →' : '查看结果 🎯'}</button>
        </div>
      `}
    </div>
  `;
  updateProgress();
  renderNavStrip();
}

function selectOption(i) {
  if(answered) return;
  document.querySelectorAll('.option').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll('.option')[i].classList.add('selected');
  document.getElementById('submitBtn').disabled = false;
}

function submitAnswer() {
  if(answered) return;
  answered = true;
  const sel = document.querySelector('.option.selected');
  const idx = parseInt(sel.dataset.index);
  const origIdx = activeList[currentQ];
  const q = questions[origIdx];
  const correct = q.options[idx].correct;

  document.querySelectorAll('.option').forEach((el,i)=>{
    el.classList.add('disabled');
    if(q.options[i].correct) el.classList.add('correct');
    if(i===idx && !correct) el.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  const analysis = document.getElementById('analysis');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');

  if(correct) {
    score++;
    streak++;
    const earned = 5;
    points += earned;
    const msg = correctMsgs[Math.floor(Math.random()*correctMsgs.length)];
    fb.className = 'feedback correct-fb show';
    fb.innerHTML = `
      <div class="feedback-emoji">${msg.emoji}</div>
      <div class="feedback-title">${msg.title}</div>
      <div class="feedback-msg">${msg.msg}</div>
      <div class="feedback-points">+${earned} 积分</div>
    `;
    flyPoints(earned);
  } else {
    streak = 0;
    const msg = wrongMsgs[Math.floor(Math.random()*wrongMsgs.length)];
    fb.className = 'feedback wrong-fb show';
    fb.innerHTML = `
      <div class="feedback-emoji">${msg.emoji}</div>
      <div class="feedback-title">${msg.title}</div>
      <div class="feedback-msg">${msg.msg}</div>
    `;
  }

  analysis.classList.add('show');
  submitBtn.classList.add('hidden');
  if(nextBtn) nextBtn.style.display = 'block';

  // 保存进度
  if (correct) {
    completedSet[origIdx] = true;
    wrongList = wrongList.filter(i => i !== origIdx);
  } else {
    if (!wrongList.includes(origIdx)) wrongList.push(origIdx);
  }
  saveProgress();
  updateStats();
  updateTopbar();
}

function flyPoints(earned) {
  const el = document.createElement('div');
  el.className = 'points-fly';
  el.textContent = `+${earned} ⭐`;
  const rect = document.querySelector('.points').getBoundingClientRect();
  el.style.left = (rect.left + rect.width/2 - 30) + 'px';
  el.style.top = (rect.top + 20) + 'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

function nextQuestion() {
  currentQ++;
  if(currentQ < activeList.length) renderQuestion();
  else showResult();
}

function prevQuestion() {
  if(currentQ > 0) { currentQ--; renderQuestion(); }
}

function renderNavStrip() {
  const strip = document.getElementById('navStrip');
  if (!strip) return;
  const qs = getCurrentQuestions();
  let html = '';
  for (let i = 0; i < qs.length; i++) {
    let cls = 'nav-dot';
    if (completedSet[i] === true) cls += ' done';
    else if (wrongList.includes(i)) cls += ' wrong';
    if (activeList[currentQ] === i) cls += ' current';
    html += `<div class="${cls}" data-idx="${i}" onclick="jumpToQuestion(${i})">${i + 1}</div>`;
  }
  strip.innerHTML = html;
  // 自动滚动到当前题目
  requestAnimationFrame(() => {
    const cur = strip.querySelector('.nav-dot.current');
    if (cur) cur.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  });
}

function jumpToQuestion(origIdx) {
  const qs = getCurrentQuestions();
  const pos = activeList.indexOf(origIdx);
  if (pos === -1) {
    // 不在当前列表，切换到全部题目模式
    currentMode = 'all';
    document.getElementById('btnNew').classList.add('active');
    document.getElementById('btnWrong').classList.remove('active');
    activeList = [];
    for (let i = 0; i < qs.length; i++) activeList.push(i);
    currentQ = origIdx;
  } else {
    currentQ = pos;
  }
  reviewMode = false;
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.querySelector('.progress-wrap').classList.remove('hidden');
  document.querySelector('.hero').classList.remove('hidden');
  renderQuestion();
}

function redoOne(origIdx) {
  delete completedSet[origIdx];
  wrongList = wrongList.filter(i => i !== origIdx);
  saveProgress();
  reviewMode = false;
  currentMode = 'all';
  const qs = getCurrentQuestions();
  activeList = [];
  for (let i = 0; i < qs.length; i++) activeList.push(i);
  currentQ = origIdx;
  updateStats();
  renderQuestion();
}

function redoAll() {
  if (confirm('确定要重做当前模块全部题目吗？这会清除该模块所有做题记录。')) {
    completedSet = {};
    wrongList = [];
    saveProgress();
    currentMode = 'all';
    reviewMode = false;
    startSession();
  }
}

function showResult() {
  const totalThisRound = activeList.length;
  const pct = Math.round(score/totalThisRound*100);
  let emoji, title, subtitle;
  if(pct === 100) {
    emoji = '🏆'; title = '全部答对！'; subtitle = '你的语境呼应法已经炉火纯青了！';
  } else if(pct >= 67) {
    emoji = '🌟'; title = '做得不错！'; subtitle = '方法已经入门了，继续练习会更强。';
  } else {
    emoji = '🌱'; title = '还需要练习'; subtitle = '看看解析，理解方法后再来一轮。';
  }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSubtitle').textContent = subtitle;
  document.getElementById('resultScore').textContent = pct + '%';
  document.getElementById('correctCount').textContent = score;
  document.getElementById('wrongCount').textContent = totalThisRound - score;
  document.getElementById('totalPoints').textContent = points;

  document.getElementById('quizArea').classList.add('hidden');
  document.querySelector('.progress-wrap').classList.add('hidden');
  document.querySelector('.hero').classList.add('hidden');
  const r = document.getElementById('resultArea');
  r.classList.remove('hidden');

  updateStats();

  // 本轮结束后检查是否全部完成
  const remaining = getCurrentQuestions().length - getCompletedCount();
  if (remaining === 0 && wrongList.length === 0) {
    setTimeout(() => {
      r.classList.add('hidden');
      showCompleteView();
    }, 3000);
  }
}

function restart() {
  document.getElementById('completeView').classList.add('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.querySelector('.progress-wrap').classList.remove('hidden');
  document.querySelector('.hero').classList.remove('hidden');
  reviewMode = false;
  startSession();
}

function updateProgress() {
  const total = activeList.length;
  if (total === 0) {
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = '0/0';
    return;
  }
  const pct = (currentQ/total)*100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${currentQ+1}/${total}`;
}

function updateTopbar() {
  document.getElementById('pointsDisplay').textContent = points;
  document.getElementById('streakDisplay').textContent = streak;
}

// 初始化
renderModuleTabs();
loadProgress();
updateStats();
updateTopbar();
startSession();
</script>
